<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registo de Residentes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Cabeçalho -->
    <header class="bg-white rounded-xl shadow-sm p-6 border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-users text-blue-600"></i> Registo de Residentes
        </h1>
        <p class="text-slate-500 text-sm mt-1">Gestão de dados dos idosos e dos respetivos familiares responsáveis.</p>
      </div>
      <div class="flex gap-2">
        <button onclick="exportarCSV()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition flex items-center gap-1.5 border border-slate-300">
          <i class="fa-solid fa-file-csv text-green-600"></i> Exportar CSV
        </button>
        <button onclick="exportarJSON()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition flex items-center gap-1.5 border border-slate-300">
          <i class="fa-solid fa-file-code text-amber-600"></i> Exportar JSON
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Formulário -->
      <section class="bg-white rounded-xl shadow-sm p-6 border border-slate-200 h-fit lg:col-span-1">
        <h2 id="formTitle" class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-user-plus text-blue-600"></i> Adicionar Idoso(a)
        </h2>
        
        <form id="residenteForm" onsubmit="salvarResidente(event)" class="space-y-4">
          <input type="hidden" id="editIndex" value="-1">
          
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="nomeIdoso">
              Idoso(a) <span class="text-red-500">*</span>
            </label>
            <input type="text" id="nomeIdoso" required placeholder="Nome completo do(a) idoso(a)" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="idade">
              Idade <span class="text-red-500">*</span>
            </label>
            <input type="number" id="idade" min="0" max="130" required placeholder="Ex: 82" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="nomeFamiliar">
              Nome do Familiar <span class="text-red-500">*</span>
            </label>
            <input type="text" id="nomeFamiliar" required placeholder="Nome do familiar responsável" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="telefone">
              Telefone do Responsável <span class="text-red-500">*</span>
            </label>
            <input type="tel" id="telefone" required placeholder="(00) 90000-0000" oninput="mascaraTelefone(this)" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="cidade">
              Cidade <span class="text-red-500">*</span>
            </label>
            <input type="text" id="cidade" required placeholder="Nome da cidade" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
          </div>

          <div class="pt-2 flex gap-2">
            <button type="submit" id="btnSalvar" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg transition shadow-sm flex items-center justify-center gap-2 text-sm">
              <i class="fa-solid fa-floppy-disk"></i> Guardar
            </button>
            <button type="button" id="btnCancelar" onclick="limparFormulario()" class="hidden w-1/3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-2.5 px-3 rounded-lg transition text-sm">
              Cancelar
            </button>
          </div>
        </form>
      </section>

      <!-- Tabela / Lista -->
      <section class="bg-white rounded-xl shadow-sm p-6 border border-slate-200 lg:col-span-2 space-y-4">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
          <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
            <i class="fa-solid fa-list-check text-blue-600"></i> Residentes Registados
            <span id="totalBadge" class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">0</span>
          </h2>
          <div class="relative w-full sm:w-64">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="inputBusca" oninput="filtrarResidentes()" placeholder="Pesquisar por nome ou cidade..." class="w-full pl-9 pr-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <div class="overflow-x-auto border border-slate-200 rounded-lg">
          <table class="w-full text-sm text-left text-slate-600">
            <thead class="text-xs text-slate-700 uppercase bg-slate-50 border-b border-slate-200">
              <tr>
                <th class="px-4 py-3">Idoso(a)</th>
                <th class="px-3 py-3">Idade</th>
                <th class="px-4 py-3">Familiar</th>
                <th class="px-4 py-3">Contacto</th>
                <th class="px-4 py-3">Cidade</th>
                <th class="px-4 py-3 text-center">Ações</th>
              </tr>
            </thead>
            <tbody id="tabelaBody">
              <!-- Preenchido via JS -->
            </tbody>
          </table>
        </div>

        <div id="emptyState" class="text-center py-8 text-slate-400">
          <i class="fa-regular fa-folder-open text-4xl mb-2 block"></i>
          <p>Nenhum residente registado ainda.</p>
        </div>
      </section>
    </div>
  </div>

  <!-- Toast de Notificação -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 transition-opacity duration-300 opacity-0 pointer-events-none z-50 text-sm">
    <i id="toastIcon" class="fa-solid fa-circle-check text-green-400"></i>
    <span id="toastMsg">Operação realizada com sucesso!</span>
  </div>

  <script>
    let residentes = JSON.parse(localStorage.getItem('residentes_db')) || [];

    function mascaraTelefone(input) {
      let v = input.value.replace(/\D/g, '');
      v = v.replace(/^(\d{2})(\d)/g, '($1) $2');
      v = v.replace(/(\d)(\d{4})$/, '$1-$2');
      input.value = v;
    }

    function renderizarTabela(lista = residentes) {
      const tbody = document.getElementById('tabelaBody');
      const emptyState = document.getElementById('emptyState');
      const totalBadge = document.getElementById('totalBadge');
      
      tbody.innerHTML = '';
      totalBadge.innerText = lista.length;

      if (lista.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      lista.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.className = 'border-b border-slate-100 hover:bg-slate-50 transition';
        tr.innerHTML = `
          <td class="px-4 py-3 font-semibold text-slate-800">${item.nomeIdoso}</td>
          <td class="px-3 py-3">${item.idade} anos</td>
          <td class="px-4 py-3">${item.nomeFamiliar}</td>
          <td class="px-4 py-3 font-mono text-xs">${item.telefone}</td>
          <td class="px-4 py-3">${item.cidade}</td>
          <td class="px-4 py-3 text-center space-x-1">
            <button onclick="copiarTextoIndividual(${index})" title="Copiar Ficha em Texto" class="p-1.5 text-slate-600 hover:text-blue-600 rounded hover:bg-slate-100 transition">
              <i class="fa-regular fa-copy"></i>
            </button>
            <button onclick="partilharWhatsApp(${index})" title="Enviar pelo WhatsApp" class="p-1.5 text-slate-600 hover:text-green-600 rounded hover:bg-slate-100 transition">
              <i class="fa-brands fa-whatsapp"></i>
            </button>
            <button onclick="editarResidente(${index})" title="Editar" class="p-1.5 text-slate-600 hover:text-amber-600 rounded hover:bg-slate-100 transition">
              <i class="fa-regular fa-pen-to-square"></i>
            </button>
            <button onclick="excluirResidente(${index})" title="Eliminar" class="p-1.5 text-slate-600 hover:text-red-600 rounded hover:bg-slate-100 transition">
              <i class="fa-regular fa-trash-can"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function salvarResidente(e) {
      e.preventDefault();
      const editIndex = parseInt(document.getElementById('editIndex').value);
      
      const novoResidente = {
        nomeIdoso: document.getElementById('nomeIdoso').value.trim(),
        idade: document.getElementById('idade').value,
        nomeFamiliar: document.getElementById('nomeFamiliar').value.trim(),
        telefone: document.getElementById('telefone').value.trim(),
        cidade: document.getElementById('cidade').value.trim()
      };

      if (editIndex >= 0) {
        residentes[editIndex] = novoResidente;
        mostrarToast('Registo atualizado com sucesso!');
      } else {
        residentes.push(novoResidente);
        mostrarToast('Residente adicionado com sucesso!');
      }

      guardarDados();
      limparFormulario();
      renderizarTabela();
    }

    function editarResidente(index) {
      const item = residentes[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('nomeIdoso').value = item.nomeIdoso;
      document.getElementById('idade').value = item.idade;
      document.getElementById('nomeFamiliar').value = item.nomeFamiliar;
      document.getElementById('telefone').value = item.telefone;
      document.getElementById('cidade').value = item.cidade;

      document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-amber-600"></i> Editar Registado`;
      document.getElementById('btnSalvar').innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Atualizar`;
      document.getElementById('btnCancelar').classList.remove('hidden');
    }

    function excluirResidente(index) {
      if (confirm(`Tem a certeza de que deseja eliminar o registo de ${residentes[index].nomeIdoso}?`)) {
        residentes.splice(index, 1);
        guardarDados();
        renderizarTabela();
        mostrarToast('Registo eliminado com sucesso!');
      }
    }

    function limparFormulario() {
      document.getElementById('residenteForm').reset();
      document.getElementById('editIndex').value = -1;
      document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-user-plus text-blue-600"></i> Adicionar Idoso(a)`;
      document.getElementById('btnSalvar').innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Guardar`;
      document.getElementById('btnCancelar').classList.add('hidden');
    }

    function formatarTextoResidente(item) {
      return `📋 *Ficha do Residente*\n` +
             `• *Idoso(a):* ${item.nomeIdoso}\n` +
             `• *Idade:* ${item.idade} anos\n` +
             `• *Nome do Familiar:* ${item.nomeFamiliar}\n` +
             `• *Telefone do Responsável:* ${item.telefone}\n` +
             `• *Cidade:* ${item.cidade}`;
    }

    function copiarTextoIndividual(index) {
      const item = residentes[index];
      const texto = formatarTextoResidente(item);
      navigator.clipboard.writeText(texto).then(() => {
        mostrarToast('Texto do residente copiado!');
      });
    }

    function partilharWhatsApp(index) {
      const item = residentes[index];
      const texto = encodeURIComponent(formatarTextoResidente(item));
      window.open(`https://api.whatsapp.com/send?text=${texto}`, '_blank');
    }

    function filtrarResidentes() {
      const termo = document.getElementById('inputBusca').value.toLowerCase();
      const filtrados = residentes.filter(item => 
        item.nomeIdoso.toLowerCase().includes(termo) ||
        item.nomeFamiliar.toLowerCase().includes(termo) ||
        item.cidade.toLowerCase().includes(termo)
      );
      renderizarTabela(filtrados);
    }

    function guardarDados() {
      localStorage.setItem('residentes_db', JSON.stringify(residentes));
    }

    function mostrarToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 3000);
    }

    function exportarCSV() {
      if (residentes.length === 0) return alert('Sem dados para exportar!');
      let csv = 'Idoso(a);Idade;Nome do Familiar;Telefone do Responsavel;Cidade\n';
      residentes.forEach(r => {
        csv += `"${r.nomeIdoso}";"${r.idade}";"${r.nomeFamiliar}";"${r.telefone}";"${r.cidade}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'residentes.csv';
      link.click();
    }

    function exportarJSON() {
      if (residentes.length === 0) return alert('Sem dados para exportar!');
      const blob = new Blob([JSON.stringify(residentes, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'residentes.json';
      link.click();
    }

    // Inicialização
    renderizarTabela();
  </script>
</body>
</html>
